<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamada DataBase</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500&display=swap">
  </head>
  <body>
    <header>
      <div class="header-logo">
        <a href="../Website/index.html"><img src="icon.png" width="70px" height="70px" class="icon"></a>
        <a href="../Website/index.html" class="main_title">Yamada</a>
      </div>
      <select onchange="location.href=value">
        <option value="">メニュー</option>
        <option value="../Website/index.html">ホームページ</option>
        <option value="../Calculator/index.html">計算機</option>
        <option value="../FavoriteThings/index.html">好きなもの紹介</option>
      </select>
    </header>
    <div class="header-space"></div>
    <h1><small>◌ </small>現金出納帳</h1>
    <div class="area">
      <h2>会計入力</h2>
      <div class="up">
        <div class="group">
          <input type="text" id="date" placeholder="日付" onfocus="this.type='date'; this.showPicker();" onblur="if(!this.value) this.type='text';">
          <input type="text" id="location" placeholder="場所">
          <input type="text" id="item" placeholder="商品名">
          <input type="number" id="amount" placeholder="金額">
        </div>
        <button onclick="AddContent()">追加</button>
      </div>
      <br>
      <div class="down">
        <h2>入出金明細表<button onclick="fullkopi()" class="fullkopi">入出金明細表の全てをコピー</button></h2>
        <table>
          <tr>
            <th>日付</th>
            <th>場所</th>
            <th>商品名</th>
            <th>金額</th>
          </tr>
        </table>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
